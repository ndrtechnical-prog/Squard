    <script>
      // Runtime constraint: HMR is disabled in AI Studio cloud preview. Ignore Vite HMR WebSocket errors.
      window.addEventListener('error', function(event) {
        if (
          (event.filename && event.filename.includes('@vite/client')) ||
          (event.message && (event.message.includes('WebSocket') || event.message.includes('ws:')))
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        var reason = String(event.reason || '');
        if (reason.includes('WebSocket') || reason.includes('@vite/client') || reason.includes('HMR')) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
